<!DOCTYPE html>

<!--

PENDIENTE: QUE SEA RESPONSIVE PARA DISTINTO FACTOR DE ASPECTO, SI ES MAS CUADRADO O ALARGADO

COTIN - CONTROL DE TIEMPO DE DOTACIONES EN INTERVENCION

Autor: Jesus Borruel

Idea y funcionamiento: 
Cronómetros para el control de tiempos en intervención de las dotaciones. 
- Es necesario incialmente ver los parámetros de configuración, en la esquina superior izquierda: tiempo inicial y cuenta progresiva o regresiva. 
- El resto, darle a los cronómetros de modo independiente. 
- Al meter la presión de entrada, pone la presión de salida como P/2+25. 
- Tiene posibilidad de meter 1min de tiempo para ver todo el proceso. 
- Mejor si lo puedes ver en el móvil o en una tablet, ya que en el móvil es un poco pequeño.

https://www.gnu.org/licenses/gpl-3.0.txt

Basado en otro material GNU y en sonidos disponibles en internet sin ánimo de lucro


-->

<html lang="es">
<head>
  <meta charset="UTF-8"> <!-- Declara UTF-8 como codificación -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adaptación para móviles -->
  <title>TABLA CONTROL DE TIEMPOS EN INTERVENCION</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
  <!-- Cargamos el font que asemeja un display de 7 segmentos de Google, ojo que no es monoespaciada -->
	<link href="https://fonts.googleapis.com/css?family=Orbitron:700" rel="stylesheet">

  <!--
  <link rel="stylesheet" href="stylesheet.css" type="text/css" charset="utf-8"/>
  -->
  <link rel="manifest" href="manifest.json">
  <script>

      navigator.serviceWorker.register('./service-worker.js')

  <style>

  /* ============================================================
     COTIN - Estilos reorganizados
     ------------------------------------------------------------
     Objetivo:
     - Una sola definición base por clase.
     - Variables de tamaño centralizadas.
     - Media queries al final, de menor a mayor prioridad.
     - Sin solapes incontrolados entre .etiqueta_tiempo, .reloj, etc.
     ============================================================ */

  /* ---------- Fuentes locales ---------- */
  @font-face {
    font-family: 'digital-7regular';
    src: url('./digital-7-webfont.woff2') format('woff2'),
         url('./digital-7-webfont.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  @font-face {
    font-family: 'LEDCalculator';
    src: url('LEDCalculator.ttf') format('truetype');
  }

  @font-face {
    font-family: 'digital-7-mono';
    src: url('digital-7-mono.ttf') format('truetype');
  }

  /* ---------- Variables generales ---------- */
  :root {
    --panel-bg: lightgrey;
    --cell-radius: clamp(4px, 0.7vmin, 9px);
    --col-gap: 3px;
    --row-gap-y: clamp(0.04rem, 0.35vh, 0.32rem);

    /* Tamaños principales */
    --fs-clock: clamp(1.45rem, 3.9vmin, 3.2rem);
    --fs-team-label: clamp(1.3rem, 3.55vmin, 2.8rem);
    --fs-row-label: clamp(1.1rem, 3.05vmin, 2.25rem);
    --fs-config-label: clamp(0.9rem, 2.45vmin, 1.65rem);

    /* Columna T0/T1/T2/T3: 00:20:00, 00:13:20... */
    --fs-time-reference: clamp(2.25rem, min(7.8vh, 5.2vw), 5.4rem);

    /* Cronómetros principales */
    --fs-timer: clamp(2.7rem, min(8.6vh, 4.9vw), 6.4rem);

    /* Presiones y entradas */
    --fs-pressure: clamp(1.35rem, 3.85vmin, 3.05rem);
    --fs-text-input: clamp(1.1rem, 3vmin, 2.2rem);
    --fs-button: clamp(1.05rem, 2.9vmin, 2.1rem);

    /* Alturas */
    --timer-box-h: clamp(4.6rem, 14vh, 8.6rem);
    --pressure-h: clamp(2.7rem, 8.2vh, 5.2rem);
    --text-input-h: clamp(2.25rem, 6.4vh, 4.1rem);
    --button-h: clamp(2.2rem, 5.9vh, 3.8rem);
  }

  /* ---------- Orientación obligatoria ---------- */
  @media (orientation: portrait) {
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background-color: #f8d7da;
      color: #721c24;
    }

    .rotate-message {
      display: block;
    }

    .app-content {
      display: none;
    }
  }

  @media (orientation: landscape) {
    .rotate-message {
      display: none;
    }

    .app-content {
      display: flex !important;
    }
  }

  /* ---------- Base de pantalla ---------- */
  html,
  body {
    height: 100%;
    min-height: 100%;
    margin: 0;
    overflow-x: hidden;
    background-color: var(--panel-bg);
  }

  .app-content {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    flex-direction: column;
  }

  .container-fluid {
    flex: 1 1 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: clamp(0.12rem, 0.45vmin, 0.45rem) !important;
  }

  .container-fluid > .row {
    flex: 1 1 0;
    align-items: center;
  }

  .row {
    margin-left: calc(-1 * var(--col-gap));
    margin-right: calc(-1 * var(--col-gap));
  }

  .row > [class^="col-"],
  .row > [class*=" col-"] {
    padding-left: var(--col-gap);
    padding-right: var(--col-gap);
    min-width: 0;
  }

  .row.py-2 {
    padding-top: var(--row-gap-y) !important;
    padding-bottom: var(--row-gap-y) !important;
  }

  /* Reparto vertical del tablero */
  .container-fluid > .row:nth-child(1) { flex-grow: 0.95; }
  .container-fluid > .row:nth-child(2) { flex-grow: 2.15; align-items: stretch; }
  .container-fluid > .row:nth-child(3),
  .container-fluid > .row:nth-child(4) { flex-grow: 0.72; }
  .container-fluid > .row:nth-child(n+5) { flex-grow: 1.08; }

  /* Fila de cronómetros: columnas en vertical para caja + botones */
  .container-fluid > .row:nth-child(2) > [class^="col-"],
  .container-fluid > .row:nth-child(2) > [class*=" col-"] {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ---------- Elementos comunes ---------- */
  .reloj,
  .etiqueta,
  .etiqueta_pq,
  .etiqueta_pq2,
  .etiqueta_tiempo,
  .timer,
  .timer2,
  .inputpending,
  .inputpending_pq,
  .inputpresion,
  .inputpresionoff,
  .inputpresionoff3,
  .pout-display,
  .custom-select,
  .btn-crono {
    border-radius: var(--cell-radius);
    line-height: 1.02;
    box-sizing: border-box;
  }

  /* ---------- Reloj negro superior y relojes de marcas reales ---------- */
  .reloj {
    font-family: 'digital-7-mono';
    font-size: var(--fs-clock);
    background-color: black;
    color: white;
    padding: 0.18em 0.35em;
    text-align: center;
    justify-content: center !important;
    align-items: center !important;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  /* ---------- Etiquetas ---------- */
  .etiqueta {
    font-family: 'Orbitron';
    font-size: var(--fs-team-label);
    text-align: center;
    background-color: grey;
    color: white;
    padding: 0.08em 0.25em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .etiqueta_pq {
    font-family: 'Orbitron';
    font-size: var(--fs-row-label);
    text-align: center;
    background-color: grey;
    color: white;
    padding: 0.08em 0.25em;
  }

  .etiqueta_pq2 {
    font-family: 'Orbitron';
    font-size: var(--fs-config-label);
    text-align: center;
    background-color: grey;
    color: white;
    padding: 0.08em 0.2em;
  }

  .etiqueta_tiempo {
    font-family: 'LEDCalculator';
    font-size: calc(var(--fs-time-reference) * 0.6);
    line-height: 0.92;
    text-align: center;
    color: black;
    padding: 0;
    white-space: nowrap;
    overflow: hidden;
  }

  /* ---------- Cronómetros principales ---------- */
  .timer,
  .timer2 {
    background-color: lightgreen;
    color: black;
    text-align: center;
  }

  .timer {
    font-family: 'Orbitron';
    font-size: var(--fs-timer);
  }

  .timer2 {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 100%;
    min-height: var(--timer-box-h);
    height: var(--timer-box-h);
    padding: clamp(0.22rem, 1.1vh, 0.75rem) clamp(0.25rem, 0.9vw, 0.9rem);
    font-family: 'LEDCalculator';
    font-weight: bold;
    font-size: var(--fs-timer);
    line-height: 0.92;
    letter-spacing: -0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }

  .timer-t1 { background-color: yellow; }
  .timer-t2 { background-color: orange; }
  .timer-t3 {
    background-color: red;
    color: white;
  }

  /* ---------- Parpadeo ---------- */
  @keyframes blink {
    0%, 100% { background-color: red; color: white; }
    50% { background-color: black; color: white; }
  }

  .blinking {
    animation: blink 1s infinite;
  }

  /* ---------- Configuración ---------- */
  .divconfig {
    font-family: 'Orbitron';
    background-color: beige;
    color: black;
    padding: clamp(0.08rem, 0.45vmin, 0.35rem) !important;
    text-align: center;
    justify-content: center;
    min-height: clamp(4.8rem, 15vh, 8.8rem);
  }

  .custom-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    text-align: center;
    text-align-last: center;
    background: white;
    width: 100% !important;
    min-height: clamp(2.2rem, 6.4vh, 3.9rem);
    height: clamp(2.2rem, 6.4vh, 3.9rem) !important;
    margin: 0 !important;
    padding: 0.2rem !important;
    font-size: var(--fs-text-input);
    font-weight: 700;
  }

  /* ---------- Botones ---------- */
  .btn-crono {
    width: clamp(6.5rem, 15vmin, 12rem);
    height: var(--button-h);
    min-height: unset;
    padding: 0.05rem 0.3rem;
    font-size: var(--fs-button);
    font-weight: 700;
    line-height: 1.1;
  }

  .container-fluid > .row:nth-child(2) .mt-3 {
    margin-top: clamp(0.25rem, 0.9vh, 0.7rem) !important;
  }


  /* ---------- Botón de reinicio total ---------- */
  #btnResetTotal {
    width: 100% !important;
    min-height: clamp(3.2rem, 9vh, 5.2rem) !important;
    height: clamp(3.2rem, 9vh, 5.2rem) !important;
    padding: 0.15rem 0.25rem !important;
    font-size: clamp(0.8rem, 2.1vmin, 1.45rem) !important;
    line-height: 1.05 !important;
    white-space: normal !important;
    text-align: center;
  }

  /* ---------- Inputs de texto ---------- */
  .inputpending,
  .inputpending_pq {
    font-family: 'Orbitron';
    font-size: var(--fs-text-input);
    text-align: right;
    background-color: beige;
    color: black;
    padding: 0.05rem 0.35rem;
  }

  .inputpending,
  .inputpending_pq,
  input.form-control {
    min-height: var(--text-input-h);
    height: var(--text-input-h) !important;
  }

  /* ---------- Presiones ---------- */
  .inputpresion,
  .inputpresionoff,
  .inputpresionoff3 {
    font-family: 'Orbitron';
    font-size: var(--fs-pressure);
    text-align: right;
    background-color: beige;
    color: black;
    padding: 0.02rem 0.35rem;
    font-weight: 700;
  }

  .inputpresionoff,
  .inputpresionoff3 {
    display: none;
  }

  .inputpresionoff3 {
    color: red;
  }

  .inputpresion,
  .inputpresionoff,
  .inputpresionoff3,
  #P51,
  #P52,
  #P53 {
    min-height: var(--pressure-h);
    height: var(--pressure-h) !important;
  }

  .pout-display {
    display: inline-flex;
    justify-content: flex-start;
    align-items: center;
    gap: 0.15rem;
    min-height: var(--pressure-h);
    height: var(--pressure-h);
    padding: 0.02rem 0.25rem;
    font-family: 'Orbitron';
    font-size: clamp(1.25rem, 3.4vmin, 2.65rem);
    color: gray;
    overflow: hidden;
  }

  .pout-label {
    color: gray;
    font-weight: bold;
    white-space: nowrap;
    font-size: 0.78em;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pout-value {
    color: red;
    font-weight: bold;
    white-space: nowrap;
    font-size: 1.05em;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Columnas internas antiguas ---------- */
  .fila-color {
    height: auto;
    min-height: clamp(2.8rem, 6.2vh, 5.4rem);
    align-items: center;
  }

  .left-div {
    float: left;
    width: 49%;
  }

  .right-div {
    float: right;
    width: 49%;
  }

  /* ============================================================
     Ajustes por tipo de pantalla
     ============================================================ */

  /* Tablets landscape casi cuadradas */
  @media (orientation: landscape) and (max-aspect-ratio: 4/3) {
    :root {
      --row-gap-y: clamp(0.04rem, 0.32vh, 0.25rem);
      --fs-clock: clamp(1.2rem, 3.35vh, 2.2rem);
      --fs-team-label: clamp(1.1rem, 3.1vh, 2.05rem);
      --fs-row-label: clamp(0.95rem, 2.7vh, 1.7rem);
      --fs-config-label: clamp(0.78rem, 2.2vh, 1.25rem);
      --fs-time-reference: clamp(2.05rem, min(7.4vh, 5.6vw), 4.8rem);
      --fs-timer: clamp(2.45rem, min(8.8vh, 4.65vw), 5.4rem);
      --fs-pressure: clamp(1.2rem, 3.65vh, 2.55rem);
      --fs-button: clamp(0.95rem, 2.65vh, 1.65rem);
      --timer-box-h: clamp(4.8rem, 15.5vh, 8.2rem);
      --pressure-h: clamp(2.5rem, 8.4vh, 4.6rem);
    }

    .container-fluid > .row:nth-child(2) {
      flex-grow: 2.35;
    }
  }

  /* Pantallas estrechas en horizontal: baja fuente antes de cortar segundos */
  @media (orientation: landscape) and (max-width: 760px) {
    :root {
      --fs-timer: clamp(1.8rem, 4.45vw, 3.2rem);
    }

    .timer2 {
      letter-spacing: -0.07em;
      padding-left: 0.18rem;
      padding-right: 0.18rem;
    }
  }

  /* Pantallas bajas: evita cortes y permite scroll si hace falta */
  @media (orientation: landscape) and (max-height: 520px) {
    :root {
      --row-gap-y: 0.03rem;
      --fs-timer: clamp(1.7rem, min(7vh, 4.7vw), 3.2rem);
      --fs-pressure: clamp(0.95rem, 3vh, 1.55rem);
      --fs-team-label: clamp(0.9rem, 2.7vh, 1.4rem);
      --fs-row-label: clamp(0.78rem, 2.35vh, 1.15rem);
      --fs-time-reference: clamp(1.35rem, 4.8vh, 2.5rem);
      --timer-box-h: clamp(2.8rem, 13vh, 4.2rem);
      --pressure-h: clamp(1.75rem, 6.3vh, 2.4rem);
      --text-input-h: clamp(1.75rem, 6.3vh, 2.4rem);
      --button-h: clamp(1.6rem, 5.5vh, 2.2rem);
    }

    .container-fluid > .row:nth-child(2) {
      flex-grow: 1.85;
    }

    .container-fluid {
      min-height: auto;
    }

    .container-fluid > .row {
      flex: 0 0 auto;
    }

    .divconfig {
      min-height: auto;
      padding: 0.15rem !important;
    }
  }

  </style> 
  
</head>
<body>
  <!-- SOLO PERMITE HORIENTACION HORIZONTAL -->
<div class="rotate-message">
  <h1>Por favor, gira tu dispositivo para usar la aplicación.</h1>
</div>
<div class="app-content">
  <!-- Contenido de tu app -->
  
	<!-- Contenedor principal es p-5 padding en el texto, a diferencia del mt5  La clase "mt-5" le da al elemento un margen (espacio exterior) de 5 unidades -->
  <!-- Tabla con el cronómetro y campos debajo de él -->
	<div class="container-fluid p-2">
    <!-- Fila de los enunciados -->
    <div class="row  py-2" style="background-color: lightgrey;">
			<!-- Columna del Reloj digital -->
			<div class="col-2" style="background-color: lightgrey;">
        <!-- RELOJ -->
        <div id="Reloj" class="text-center reloj">00:00:00</div>
      </div>
      <!-- Columna vacía de separación -->
			<div class="col-1" style="background-color: lightgrey;"></div>
      <!-- Columnas de los equipos -->
			<div class="col-3" style="background-color: lightgrey;">
        <!-- RELOJ -->
        <div id="EQUIPO1" class="text-center etiqueta" style="background-color: red;">EQUIPO 1</div>

      </div>
			<div class="col-3" style="background-color: lightgrey;">
        <!-- RELOJ -->
        <div id="EQUIPO2" class="text-center etiqueta" style="background-color: blue;">EQUIPO 2</div>
      </div>
			<div class="col-3" style="background-color: lightgrey;">
        <!-- RELOJ -->
        <div id="EQUIPO3" class="text-center etiqueta " style="background-color: green;">EQUIPO 3</div>
      </div>
    </div>
    <!-- Fila de los cronómetros -->
    <div class="row  py-2" style="background-color: lightgrey;">
      <!-- Botón de reinicio total -->
			<div class="col-1 divconfig etiqueta_pq2" id="columna-reset-total">
        <button
          id="btnResetTotal"
          class="btn btn-warning btn-crono"
          type="button"
          onclick="hardResetApp()">
          RESET<br>TOTAL
        </button>
      </div>
      <!-- Columna del picker-select -->
			<div class="col-1 divconfig etiqueta_pq2" id="columna-picker">
        <!-- Widget Dropdown Picker -->
        <label for="dropdown-picker">T.Alarma (minutos)</label>
        <select id="dropdown-picker" class="custom-select" autocomplete="off">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20" selected>20</option>
          <option value="25">25</option>
          <option value="30">30</option>
          <option value="35">35</option>
          <option value="40">40</option>
          <option value="45">45</option>
          <option value="50">50</option>
          <option value="60">60</option>
          <option value="70">70</option>
          <option value="80">80</option>
          <option value="90">90</option>
          <option value="100">100</option>
          <option value="110">110</option>
          <option value="120">120</option>
        </select>
      </div>
      <!-- Columna del picker-select para cuenta progresiva o regresiva-->
      <div class="col-1 divconfig etiqueta_pq2" id="columna-CuentaUpDown">
        <!-- Widget Dropdown Picker -->
        <label for="CuentaUpDown">Cuenta (Up/Down)</label>
        <select id="CuentaUpDown" class="custom-select w-100" autocomplete="off">
          <option value="Up">&uArr;</option>
          <option value="Down" selected>&dArr;</option>

        </select>
      </div>
      <!-- Columna del cronómetro 1 -->
      <div class="col-3">
        <!-- Cronómetro 1-->
        <div id="timer1" class="text-center timer2">00:00:00</div>
        <!-- Botones del cronómetro 1 -->
        <div class="text-center mt-3">
          <button id="StartBtn1" class="btn btn-success mr-2 btn-crono" onclick="startTimer(1)">START</button>
          <button id="StopBtn1" class="btn btn-danger  mr-2 btn-crono" onclick="stopTimer(1)">STOP</button>
        </div>
      </div>      
       <!-- Columna del cronómetro 2 -->
      <div class="col-3">
        <!-- Cronómetro 2 -->
        <div id="timer2" class="text-center timer2">00:00:00</div>
        <!-- Botones del cronómetro 2-->
        <div class="text-center mt-3">
          <button id="StartBtn2" class="btn btn-success mr-2 btn-crono" onclick="startTimer(2)">START</button>
          <button id="StopBtn2" class="btn btn-danger  mr-2 btn-crono" onclick="stopTimer(2)">STOP</button>
        </div>
      </div>      
        <!-- Columna del cronómetro 3 -->
      <div class="col-3" style="background-color: lightgrey;">
        <!-- Cronómetro 3 -->
        <div id="timer3" class="text-center timer2">00:00:00</div>
        <!-- Botones del cronómetro 3 -->
        <div class="text-center mt-3">
          <button id="StartBtn3" class="btn btn-success mr-2 btn-crono" onclick="startTimer(3)">START</button>
          <button id="StopBtn3" class="btn btn-danger  mr-2 btn-crono" onclick="stopTimer(3)">STOP</button>
        </div>
      </div>        
    </div>
    
    <!-- Fila de los campos de texto de EQUIPO-ID -->
    <div class="row  fila-color py-2" style="background-color: lightgrey;">
			<div class="col-3 etiqueta_pq">
        <div>NOMBRE EQUIPO</div>
      </div>
			<div class="col-3">
        <input type="text" class="form-control inputpending" id="Equipo1" maxlength="20" placeholder="(EQUIPO-ID)" >
      </div>
      <div class="col-3">
        <input type="text" class="form-control inputpending" id="Equipo2" maxlength="20" placeholder="(EQUIPO-ID)" >
      </div>     
       <div class="col-3">
        <input type="text" class="form-control inputpending" id="Equipo3" maxlength="20" placeholder="(EQUIPO-ID)" >
      </div>       
    </div>  
    
    <!-- Fila de los campos de texto de ASIGNACION -->
    <div class="row  fila-color py-2" style="background-color: lightgrey;">
			<div class="col-3 etiqueta_pq">
        <div>TAREA / ASIGNACION </div>
      </div>
			<div class="col-3" style="background-color: lightgrey;">
        <input type="text" class="form-control inputpending_pq" id="Asignacion1" maxlength="35" placeholder="(ASIGNACION)" >

  <script>
  
  // Obtenemos el elemento "select"
  var dropdownPicker = document.getElementById("dropdown-picker");
  var alarmTime = 20*60;
  var countingSelect = document.getElementById("CuentaUpDown");
  var countingDown = true;
  
  var audio1 = new Audio("https://www.e2s.com/system/1/assets/files/000/000/423/423/854c33e83/original/TF050.WAV"); 
  var audio2 = new Audio("https://www.e2s.com/system/1/assets/files/000/000/416/416/0c52c2259/original/TF048.WAV");

// Arrays for storing the audio objects
  var alarm = [
    false,
    false,
    false,
    false
  ];
  
var audio = [
  [audio1, audio1, audio2],
  [audio1, audio1, audio2],
  [audio1, audio1, audio2]
];


// Set loop properties for all audios in the array
audio.forEach(row => {
  row.forEach(a => {
    a.loop = true;  // Configura el bucle para cada elemento de audio
  });
});

// El estado acústico/visual se controla de forma centralizada para evitar
// que un botón o un cronómetro se queden "colgados" en blinking.
var acknowledgedAlarmState = [0, 0, 0, 0];

function clearTimerAlarmVisual(timerNumber) {
  const timerElement = document.getElementById(`timer${timerNumber}`);
  timerElement.classList.remove("blinking", "timer-t1", "timer-t2", "timer-t3", "timer");
  timerElement.onclick = null;
}

function setTimerAlarmVisual(timerNumber, estado, pendingAck) {
  const timerElement = document.getElementById(`timer${timerNumber}`);
  if (!timerElement) { return; }

  timerElement.classList.remove("timer-t1", "timer-t2", "timer-t3", "timer", "blinking");
  timerElement.onclick = null;

  // Estado 0 = todavía no ha alcanzado ningún hito temporal.
  // No debe aplicar color de alarma.
  if (estado < 1) { return; }

  timerElement.classList.add(`timer-t${estado}`);
  if (pendingAck) {
    timerElement.classList.add("blinking");
    timerElement.onclick = function() { stopAlarmSound(timerNumber, estado); };
  }
}

function stopAllAlarmSounds(timerNumber) {
  if (!audio[timerNumber - 1]) { return; }
  audio[timerNumber - 1].forEach(a => {
    a.pause();
    a.currentTime = 0;
  });
  alarm[timerNumber] = false;
}

// Function to play the regular alarm sound for a specific timer
function playAlarmSound(timerNumber,estado) {
  stopAllAlarmSounds(timerNumber); // evita solapes si se salta de T1 a T2/T3
  alarm[timerNumber] = true;
  audio[timerNumber - 1][estado-1].play().catch(() => {
    // El navegador puede bloquear el audio si no hay interacción previa.
    // El parpadeo queda igualmente como aviso visual.
  });
  setTimerAlarmVisual(timerNumber, estado, true);
}

// Function to stop the regular alarm sound for a specific timer
function stopAlarmSound(timerNumber,estado) {
  stopAllAlarmSounds(timerNumber);
  if (estado < 1) {
    clearTimerAlarmVisual(timerNumber);
    saveAppState();
    return;
  }
  acknowledgedAlarmState[timerNumber] = Math.max(acknowledgedAlarmState[timerNumber] || 0, estado);
  setTimerAlarmVisual(timerNumber, estado, false);
  saveAppState();
}


// Asignamos un manejador de evento "change" al elemento "select"
  dropdownPicker.addEventListener("change", function() {
    // Obtenemos el valor seleccionado
    alarmTime = dropdownPicker.value;
		// Convertimos el tiempo de la alarma a segundos
		alarmTime *= 60;
    saveAppState();
  });

  // Asignamos un manejador de evento "change" al elemento "select"
  countingSelect.addEventListener("change", function() {
    // Obtenemos el valor seleccionado
    countingDown = (countingSelect.value == "Down");
    saveAppState();
  });
  
  // Empezamos el RELOJ
  var clockInterval = setInterval(updateClock, 1000);  
  
  
	<!-- Funciones para manejar los cronómetros -->
  // Variable para almacenar el intervalo del cronómetro
  var timer = [0,0,0,0]   //Variable booleana para saber si está contando o no cada reloj
  var time = [0,0,0,0]    // 
  var startTime = [0, 0, 0, 0];
  var pausedTime = [0, 0, 0, 0];
  
  // Variable para almacenar el tiempo transcurrido
  var elapsedTime = [0, 0, 0, 0];
  var timeNotSetted = true;

  // ============================================================
  // Persistencia local de la intervención
  // ------------------------------------------------------------
  // Guarda el estado en localStorage para poder cerrar/reabrir
  // la app y recuperar cronómetros, presiones, textos y estilos.
  // ============================================================
  const STORAGE_KEY = "COTIN_estado_v1";
  const RESET_FLAG_KEY = "COTIN_reset_total_en_curso";
  var restoringState = false;
  var suppressPersistence = false;

  function getElementState(id) {
    const el = document.getElementById(id);
    if (!el) { return null; }
    return {
      value: ("value" in el) ? el.value : undefined,
      innerHTML: el.innerHTML,
      textContent: el.textContent,
      display: el.style.display,
      disabled: !!el.disabled,
      className: el.className
    };
  }

  function applyElementState(id, state) {
    const el = document.getElementById(id);
    if (!el || !state) { return; }
    if (state.value !== undefined && "value" in el) { el.value = state.value; }
    if (state.innerHTML !== undefined) { el.innerHTML = state.innerHTML; }
    if (state.display !== undefined) { el.style.display = state.display; }
    if (state.disabled !== undefined) { el.disabled = state.disabled; }
    if (state.className !== undefined) { el.className = state.className; }
  }

  var pendingSaveTimeout = null;

  function buildAppState() {
    const idsToSave = [
      "dropdown-picker", "CuentaUpDown",
      "columna-picker", "columna-CuentaUpDown",
      "T0_TXT", "T1_TXT", "T2_TXT", "T3_TXT", "TF_TXT",
      "Equipo1", "Equipo2", "Equipo3",
      "Asignacion1", "Asignacion2", "Asignacion3",
      "Pout1", "Pout2", "Pout3"
    ];

    for (let equipo = 1; equipo <= 3; equipo++) {
      idsToSave.push(`timer${equipo}`);
      idsToSave.push(`StartBtn${equipo}`);
      idsToSave.push(`StopBtn${equipo}`);
      idsToSave.push(`initTimeField${equipo}`);
      idsToSave.push(`oneQuartersTimeField${equipo}`);
      idsToSave.push(`twoQuartersTimeField${equipo}`);
      idsToSave.push(`totalTimeField${equipo}`);
      for (let estado = 0; estado <= 5; estado++) {
        idsToSave.push(`P${estado}${equipo}`);
      }
    }

    const elements = {};
    idsToSave.forEach(id => { elements[id] = getElementState(id); });

    const running = [false, false, false, false];
    for (let i = 1; i <= 3; i++) {
      running[i] = timer[i] !== 0;
    }

    return {
      version: 2,
      savedAt: Date.now(),
      alarmTime: alarmTime,
      countingDown: countingDown,
      timeNotSetted: timeNotSetted,
      startTime: startTime,
      pausedTime: pausedTime,
      elapsedTime: elapsedTime,
      acknowledgedAlarmState: acknowledgedAlarmState,
      running: running,
      elements: elements
    };
  }

  function saveAppStateNow() {
    if (restoringState || suppressPersistence) { return; }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(buildAppState()));
    } catch (e) {
      console.warn("No se ha podido guardar el estado local de COTIN", e);
    }
  }

  function saveAppState() {
    if (restoringState || suppressPersistence) { return; }

    // localStorage es síncrono: agrupamos escrituras para no grabar varias
    // veces seguidas cuando hay cronómetros activos o se teclean presiones.
    if (pendingSaveTimeout) { clearTimeout(pendingSaveTimeout); }
    pendingSaveTimeout = setTimeout(function() {
      pendingSaveTimeout = null;
      saveAppStateNow();
    }, 250);
  }

  function restoreButtonHandlers(timerNumber, running, hasStarted) {
    const startButton = document.getElementById(`StartBtn${timerNumber}`);
    const stopButton = document.getElementById(`StopBtn${timerNumber}`);

    if (startButton) {
      startButton.onclick = function() { startTimer(timerNumber); };
      startButton.disabled = !!running;
    }

    if (!stopButton) { return; }

    if (running) {
      stopButton.textContent = "STOP";
      stopButton.classList.remove("btn-warning");
      stopButton.classList.add("btn-danger");
      stopButton.onclick = function() { stopTimer(timerNumber); };
    } else if (hasStarted) {
      stopButton.textContent = "RESET";
      stopButton.classList.remove("btn-danger");
      stopButton.classList.add("btn-warning");
      stopButton.onclick = function() { resetTimer(timerNumber); };
    } else {
      stopButton.textContent = "STOP";
      stopButton.classList.remove("btn-warning");
      stopButton.classList.add("btn-danger");
      stopButton.onclick = null;
    }
  }

  function clearStoredAppState() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function setInitialConfigControls() {
    alarmTime = 20 * 60;
    countingDown = true;
    timeNotSetted = true;

    dropdownPicker.value = "20";
    countingSelect.value = "Down";
    dropdownPicker.disabled = false;
    countingSelect.disabled = false;

    document.getElementById("columna-picker").style.backgroundColor = "";
    document.getElementById("columna-CuentaUpDown").style.backgroundColor = "";
  }

  function resetTeamSilently(timerNumber) {
    clearInterval(timer[timerNumber]);
    timer[timerNumber] = 0;
    elapsedTime[timerNumber] = 0;
    startTime[timerNumber] = 0;
    pausedTime[timerNumber] = 0;
    acknowledgedAlarmState[timerNumber] = 0;

    stopAllAlarmSounds(timerNumber);
    clearTimerAlarmVisual(timerNumber);

    const timerElement = document.getElementById(`timer${timerNumber}`);
    if (timerElement) { timerElement.innerHTML = "00:00:00"; }

    const startButton = document.getElementById(`StartBtn${timerNumber}`);
    if (startButton) {
      startButton.disabled = false;
      startButton.onclick = function() { startTimer(timerNumber); };
    }

    const stopButton = document.getElementById(`StopBtn${timerNumber}`);
    if (stopButton) {
      stopButton.textContent = "STOP";
      stopButton.classList.remove("btn-warning");
      stopButton.classList.add("btn-danger");
      stopButton.onclick = null;
    }

    [0,1,2,3,4,5].forEach(estado => {
      const el = document.getElementById(`P${estado}${timerNumber}`);
      if (!el) { return; }
      el.value = "";
      el.disabled = false;
      el.classList.remove("blinking");
    });

    const p4 = document.getElementById(`P4${timerNumber}`);
    if (p4) { p4.disabled = true; }

    [1,2,3,5].forEach(estado => {
      const el = document.getElementById(`P${estado}${timerNumber}`);
      if (el) { el.style.display = "none"; }
    });

    const pout = document.getElementById(`Pout${timerNumber}`);
    if (pout) { pout.textContent = ""; }

    [
      `initTimeField${timerNumber}`,
      `oneQuartersTimeField${timerNumber}`,
      `twoQuartersTimeField${timerNumber}`,
      `totalTimeField${timerNumber}`
    ].forEach(id => {
      const el = document.getElementById(id);
      if (!el) { return; }
      el.innerHTML = "";
      el.classList.remove("reloj");
      el.style.display = "none";
    });
  }

  function resetAppToCleanInitialState() {
    suppressPersistence = true;
    if (pendingSaveTimeout) {
      clearTimeout(pendingSaveTimeout);
      pendingSaveTimeout = null;
    }

    setInitialConfigControls();

    ["T0_TXT", "T1_TXT", "T2_TXT", "T3_TXT", "TF_TXT"].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.innerHTML = ""; }
    });

    ["Equipo1", "Equipo2", "Equipo3", "Asignacion1", "Asignacion2", "Asignacion3"].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.value = ""; el.disabled = false; el.classList.remove("blinking"); }
    });

    for (let i = 1; i <= 3; i++) {
      resetTeamSilently(i);
    }
  }

  function shouldStartClean() {
    const params = new URLSearchParams(window.location.search);
    let resetFlag = false;
    try { resetFlag = sessionStorage.getItem(RESET_FLAG_KEY) === "1"; } catch(e) {}
    return resetFlag || params.has("reset");
  }

  function consumeCleanStartFlag() {
    try { sessionStorage.removeItem(RESET_FLAG_KEY); } catch(e) {}
    if (window.location.search.includes("reset")) {
      try {
        const cleanUrl = window.location.origin === "null"
          ? window.location.pathname
          : window.location.origin + window.location.pathname;
        history.replaceState(null, document.title, cleanUrl);
      } catch(e) {}
    }
  }

  function hardResetApp() {
    const ok = confirm("¿Borrar completamente la intervención actual y empezar un escenario nuevo?");
    if (!ok) { return; }

    suppressPersistence = true;
    if (pendingSaveTimeout) {
      clearTimeout(pendingSaveTimeout);
      pendingSaveTimeout = null;
    }

    clearStoredAppState();
    try { sessionStorage.setItem(RESET_FLAG_KEY, "1"); } catch(e) {}

    // Reinicio visual inmediato por si el navegador no recarga al instante.
    resetAppToCleanInitialState();

    // Recarga con parámetro anti-caché. En la carga nueva, restoreAppState()
    // detectará el reset y NO restaurará ningún estado antiguo.
    const base = window.location.href.split("?")[0].split("#")[0];
    window.location.replace(base + "?reset=" + Date.now());
  }

  function restoreAppState() {
    if (shouldStartClean()) {
      clearStoredAppState();
      resetAppToCleanInitialState();
      consumeCleanStartFlag();
      suppressPersistence = false;
      return;
    }

    let rawState;
    try {
      rawState = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      console.warn("No se ha podido leer el estado local de COTIN", e);
      return;
    }
    if (!rawState) {
      setInitialConfigControls();
      suppressPersistence = false;
      return;
    }

    let state;
    try {
      state = JSON.parse(rawState);
    } catch (e) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      return;
    }

    restoringState = true;

    alarmTime = state.alarmTime || alarmTime;
    countingDown = (typeof state.countingDown === "boolean") ? state.countingDown : countingDown;
    timeNotSetted = (typeof state.timeNotSetted === "boolean") ? state.timeNotSetted : timeNotSetted;

    startTime = Array.isArray(state.startTime) ? state.startTime : startTime;
    pausedTime = Array.isArray(state.pausedTime) ? state.pausedTime : pausedTime;
    elapsedTime = Array.isArray(state.elapsedTime) ? state.elapsedTime : elapsedTime;
    acknowledgedAlarmState = Array.isArray(state.acknowledgedAlarmState) ? state.acknowledgedAlarmState : acknowledgedAlarmState;

    if (state.elements) {
      Object.keys(state.elements).forEach(id => applyElementState(id, state.elements[id]));
    }

    dropdownPicker.value = String(alarmTime / 60);
    countingSelect.value = countingDown ? "Down" : "Up";
    dropdownPicker.disabled = !timeNotSetted;
    countingSelect.disabled = !timeNotSetted;

    // Los intervalos no se pueden guardar; se recrean si el reloj estaba corriendo.
    timer = [0, 0, 0, 0];
    for (let i = 1; i <= 3; i++) {
      const wasRunning = !!(state.running && state.running[i]);
      const hasStarted = !!(startTime[i] || pausedTime[i] || elapsedTime[i]);

      stopAllAlarmSounds(i);

      if (wasRunning) {
        timer[i] = setInterval(function() {
          updateTimer(i);
        }, 1000);
        updateTimer(i);
      }

      restoreButtonHandlers(i, wasRunning, hasStarted);

      const currentState = getCurrentAlarmState(i);
      if (hasStarted && currentState > 0 && acknowledgedAlarmState[i] >= currentState) {
        setTimerAlarmVisual(i, currentState, false);
      }
    }

    restoringState = false;
  }

  function bindAutosaveEvents() {
    const autosaveIds = [
      "dropdown-picker", "CuentaUpDown",
      "Equipo1", "Equipo2", "Equipo3",
      "Asignacion1", "Asignacion2", "Asignacion3"
    ];

    for (let equipo = 1; equipo <= 3; equipo++) {
      for (let estado = 0; estado <= 5; estado++) {
        autosaveIds.push(`P${estado}${equipo}`);
      }
    }

    autosaveIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) { return; }
      el.addEventListener("input", saveAppState);
      el.addEventListener("change", saveAppState);
    });
  }


  // Función que fija el tiempo INICIAL de los cronómetros (dependiendo de los valores elegidos en el desplegable)
  function setTime() {
    timeNotSetted = false;
    // "Deshabilitamos" el elemento "select"
    dropdownPicker.disabled = true;
    countingSelect.disabled = true;
    // cambiar de estilo al columna-picker --> no al dropdownPicker.style.backgroundColor = "lightgrey";
    // document.getElementById("columna-picker").style.backgroundColor = "lightgrey";
    document.getElementById("columna-picker").style.backgroundColor = "lightgrey";
    document.getElementById("columna-CuentaUpDown").style.backgroundColor = "lightgrey";
    saveAppState();

    if (countingDown) {
      document.getElementById("T0_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 3 / 3));
      document.getElementById("T1_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 2 / 3));
      document.getElementById("T2_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 1 / 3));
      document.getElementById("T3_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 0 / 3));
      }
    else {
      document.getElementById("T3_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 3 / 3));
      document.getElementById("T2_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 2 / 3));
      document.getElementById("T1_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 1 / 3));
      document.getElementById("T0_TXT").innerHTML += getFormattedTime(Math.round(alarmTime * 0 / 3));
      }
  }

  // Función que inicia el cronómetro
  function startTimer(timerNumber) {

		// Inhabilita el click sobre el botón de nuevo:
		const startButton = document.getElementById(`StartBtn${timerNumber}`);
		startButton.disabled = true;
		// Calcula el tiempo que debe escribir en los cronómetros, si no se ha hecho antes
    if (timeNotSetted) {setTime();}
    mostrarInput(5,timerNumber); // Mostrar campo de presión de salida real inmediatamente al iniciar
    
    // Si el cronómetro está detenido, guardamos el tiempo de inicio
    if (timer[timerNumber] === 0) {
        startTime[timerNumber] = Date.now() - (pausedTime[timerNumber] || 0);
        pausedTime[timerNumber] = 0; // Resetear tiempo pausado
    }
    timer[timerNumber] = setInterval(function() {
        updateTimer(timerNumber);
    }, 1000);
    
    // Cambiar el botón de RESET a STOP y restaurar el estilo
    const stopButton = document.getElementById(`StopBtn${timerNumber}`);
    stopButton.textContent = "STOP"; // Cambiar el texto a "STOP"
    stopButton.classList.remove("btn-warning"); // Eliminar la clase de advertencia
    stopButton.classList.add("btn-danger"); // Agregar la clase de "btn-danger" para color rojo
    // Restaurar la función onclick al comportamiento original (stopTimer)
    stopButton.onclick = function() {
      stopTimer(timerNumber);
      };
    saveAppState();
        
  }
  


function getCurrentAlarmState(timerNumber) {
  if (elapsedTime[timerNumber] >= alarmTime) { return 3; }
  if (elapsedTime[timerNumber] >= Math.round(alarmTime * 2 / 3)) { return 2; }
  if (elapsedTime[timerNumber] >= Math.round(alarmTime / 3)) { return 1; }
  return 0;
}

// Función que detiene el cronómetro
function stopTimer(timerNumber) {
  // Si todavía no se ha iniciado, no hacemos nada.
  if (timer[timerNumber] === 0 && startTime[timerNumber] === 0) { return; }

  // Detenemos el intervalo del cronómetro
  clearInterval(timer[timerNumber]);
  timer[timerNumber] = 0;
  pausedTime[timerNumber] = Date.now() - startTime[timerNumber];

  // Parar sonido/parpadeo pendiente, pero conservar el color de la última alarma reconocida.
  if (alarm[timerNumber]) {
    const currentState = getCurrentAlarmState(timerNumber);
    stopAlarmSound(timerNumber, currentState);
  }

  // Habilita el click sobre el botón de START de nuevo:
	const startButton = document.getElementById(`StartBtn${timerNumber}`);
	startButton.disabled = false;  

  const stopButton = document.getElementById(`StopBtn${timerNumber}`);
  stopButton.textContent = "RESET";
  stopButton.classList.remove("btn-danger");
  stopButton.classList.add("btn-warning");
  stopButton.onclick = function() {
    resetTimer(timerNumber);
  };
  saveAppState();
}


// Función para resetear cronómetro y campos asociados
function resetTimer(timerNumber) {

  const confirmReset = confirm("¿Seguro de que desea resetear el contador?");
  if (!confirmReset) { return; }

  clearInterval(timer[timerNumber]);
  timer[timerNumber] = 0;

  elapsedTime[timerNumber] = 0;
  startTime[timerNumber] = 0;
  pausedTime[timerNumber] = 0;
  acknowledgedAlarmState[timerNumber] = 0;

  const timerElement = document.getElementById(`timer${timerNumber}`);
  timerElement.innerHTML = "00:00:00";

  // Parar cualquier audio y limpiar cualquier estado visual residual.
  stopAllAlarmSounds(timerNumber);
  clearTimerAlarmVisual(timerNumber);

  // Borrar valores y estados de presión.
  [0,1,2,3,4,5].forEach(estado => {
    const el = document.getElementById(`P${estado}${timerNumber}`);
    if (!el) { return; }
    el.value = "";
    el.disabled = false;
    el.classList.remove("blinking");
  });

  // P4 es el valor teórico oculto; vuelve a quedar bloqueado tras limpiar.
  const p4 = document.getElementById(`P4${timerNumber}`);
  if (p4) { p4.disabled = true; }

  // Limpiar valor visual P.OUT teórico.
  const pout = document.getElementById(`Pout${timerNumber}`);
  if (pout) { pout.textContent = ""; }

  // Ocultar inputs anticipados/condicionales. P0 queda visible.
  [1,2,3,5].forEach(estado => {
    const el = document.getElementById(`P${estado}${timerNumber}`);
    if (el) { el.style.display = "none"; }
  });

  // Ocultar relojes relacionados y limpiar contenido/clase visual.
  [
    `initTimeField${timerNumber}`,
    `oneQuartersTimeField${timerNumber}`,
    `twoQuartersTimeField${timerNumber}`,
    `totalTimeField${timerNumber}`
  ].forEach(id => {
    const el = document.getElementById(id);
    if (!el) { return; }
    el.innerHTML = "";
    el.classList.remove("reloj");
    el.style.display = "none";
  });

  // Restaurar botón START.
	const startButton = document.getElementById(`StartBtn${timerNumber}`);
	startButton.disabled = false;

  // Restaurar botón STOP al estado inicial, sin acción hasta que se pulse START.
  const stopButton = document.getElementById(`StopBtn${timerNumber}`);
  stopButton.textContent = "STOP";
  stopButton.classList.remove("btn-warning");
  stopButton.classList.add("btn-danger");
  stopButton.onclick = null;
  saveAppState();
}


  	// Función que actualiza el display del cronómetro TIMERNUMBER!!
		function updateTimer(timerNumber) {
		  // Primero miro si se han perdido alarmas desde la última vez que se actualizaron relojes:
		   // La pestaña ha recuperado el foco
      checkMissedAlarms();
			
      const currentTime = Date.now();
      // Calcular el tiempo transcurrido en segundos desde que se inició
      elapsedTime[timerNumber] = Math.floor((currentTime - startTime[timerNumber]) / 1000);
  
      // Actualizamos el cronómetro en la interfaz en función de `countingDown` o `countingUp`
      if (countingDown) {
          time[timerNumber] = getFormattedTime(alarmTime - elapsedTime[timerNumber]);
      } else {
          time[timerNumber] = getFormattedTime(elapsedTime[timerNumber]);
      }
      document.getElementById(`timer${timerNumber}`).innerHTML = time[timerNumber];

      	
			// Si es el inicio, actualizamos el campo correspondiente a la hora de inicio
			if (elapsedTime[timerNumber] == 1) {
				document.getElementById(`initTimeField${timerNumber}`).innerHTML = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
				document.getElementById(`initTimeField${timerNumber}`).classList.add('reloj');
				document.getElementById(`initTimeField${timerNumber}`).style.display = "block";
				mostrarInput(1,timerNumber); // Mostrar campos de presión para T1 al inicio
			}
			// Si hemos llegado a 1/3 del tiempo de la alarma, actualizamos el campo correspondiente
			if (elapsedTime[timerNumber] == Math.round(alarmTime / 3)) {
				document.getElementById(`oneQuartersTimeField${timerNumber}`).innerHTML = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
				document.getElementById(`oneQuartersTimeField${timerNumber}`).classList.add('reloj');
				document.getElementById(`oneQuartersTimeField${timerNumber}`).style.display = "block";
        mostrarInput(2,timerNumber); // Mostrar campos de presión para T2 cuando se cumple T1
				playAlarmSound(timerNumber,1);
				// Añadimos el evento para detener el parpadeo al hacer clic
        document.getElementById(`timer${timerNumber}`).onclick = function() { stopAlarmSound(timerNumber,1); };
			}
			// Si hemos llegado a 2/3 del tiempo de la alarma, actualizamos el campo correspondiente
			if (elapsedTime[timerNumber] == Math.round(alarmTime * 2 / 3)) {
				document.getElementById(`twoQuartersTimeField${timerNumber}`).innerHTML = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
				document.getElementById(`twoQuartersTimeField${timerNumber}`).classList.add('reloj');
				document.getElementById(`twoQuartersTimeField${timerNumber}`).style.display = "block";
				mostrarInput(3,timerNumber); // Mostrar campos de presión para T3 cuando se cumple T2
				playAlarmSound(timerNumber,2);
				// Añadimos el evento para detener el parpadeo al hacer clic
        document.getElementById(`timer${timerNumber}`).onclick = function() { stopAlarmSound(timerNumber,2); };
			}
			// Si hemos llegado al tiempo de la alarma, actualizamos el campo correspondiente y reproducimos un sonido
			if (elapsedTime[timerNumber] == alarmTime) {
				//document.getElementById("total1").innerHTML = new Date().toUTCString();
				document.getElementById(`totalTimeField${timerNumber}`).innerHTML = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
				document.getElementById(`totalTimeField${timerNumber}`).classList.add('reloj');
				document.getElementById(`totalTimeField${timerNumber}`).style.display = "block";
				mostrarInput(5,timerNumber); // Mostrar campos de presión de salida real cuando se cumple T3
				playAlarmSound(timerNumber,3);
				// Añadimos el evento para detener el parpadeo al hacer clic
        document.getElementById(`timer${timerNumber}`).onclick = function() { stopAlarmSound(timerNumber,3); };
			}
      saveAppState();
		}


    // Función que actualiza el reloj (negro, esquina superior izquierda)
    function updateClock() {
      // Obtenemos la fecha y hora actuales
      var date = new Date();
      // Obtenemos las horas, minutos y segundos
      var hours = date.getHours();
      var minutes = date.getMinutes();
      var seconds = date.getSeconds();
      // Añadimos un 0 a la izquierda si es necesario
      if (hours < 10) {
        hours = "0" + hours;
      }
      if (minutes < 10) {
        minutes = "0" + minutes;
      }
      if (seconds < 10) {
        seconds = "0" + seconds;
      }
      // Mostramos la hora en el elemento con ID "clock"
      document.getElementById("Reloj").innerHTML = hours + ":" + minutes + ":" + seconds;
    }

		// Función que convierte un tiempo en segundos a formato hh:mm:ss
    function getFormattedTime(time) {
      // Calculamos las horas, minutos y segundos
      var hours = Math.floor(Math.abs(time) / 3600);
      var minutes = Math.floor((Math.abs(time) % 3600) / 60);
      var seconds = Math.abs(time) % 60;
      // Añadimos un 0 a la izquierda si es necesario
      if (hours < 10) {
        hours = "0" + hours;
      }
      if (minutes < 10) {
        minutes = "0" + minutes;
      }
      if (seconds < 10) {
        seconds = "0" + seconds;
      }
      // Mejor quito el "-"
      /*
      // Si el tiempo es negativo, añadimos un signo menos al principio
      if (time < 0) {
        return "-" + hours + ":" + minutes + ":" + seconds;
      }*/
      // Si el tiempo es positivo o cero, devolvemos el tiempo en formato hh:mm:ss
      return hours + ":" + minutes + ":" + seconds;
    }

    function mostrarInput(estado, id) {
      // Obtener el elemento input con el ID especificado
      var input = document.getElementById(`P${estado}${id}`);
      // Establecer su propiedad display a "block"
      input.style.display = "block";
    }

    function calculoPOut(id) {
      // Obtener el valor del input
      var inputElement = document.getElementById('P0' + id);
      var value = parseFloat(inputElement.value);
      
      // Obtener los límites min y max
      var min = parseFloat(inputElement.min);
      var max = parseFloat(inputElement.max);
      
      // Verificar si el valor está fuera del rango
      if (value < min || value > max) {
        // Mostrar un mensaje de error o corregir el valor
        alert('El valor debe estar entre ' + min + ' y ' + max);
        
        // Restablecer el valor al mínimo o máximo permitido
        if (value < min) {
          value = min;
        } else if (value > max) {
          value = max;
        }
      }
      //  Pout = Pin/2 + 25
      const Pout = value / 2 + 25;
      inputElement.value = value; // Por si es mayor o menor que el permitido...
      document.getElementById("P4"+id).value = Pout;
      document.getElementById(`P4${id}`).disabled = true;
      //document.getElementById(`Pout${id}`).textContent = `P.OUT: ${Pout}`;
      document.getElementById(`Pout${id}`).textContent = `${Pout}`;
      saveAppState();
    }
    
    // Funcion para chequear la presion de entrada. Si 
    function checkPin(id,estado) {
      var inputElement = document.getElementById('P' + estado + id);
      var previousElement = document.getElementById('P' + (estado-1) + id);
      var value = parseFloat(inputElement.value);
      var max = parseFloat(previousElement.value);
      var min = parseFloat(document.getElementById('P4' + id).value);

      // Rellenar o validar una presión NO debe cambiar el color del cronómetro.
      // El color solo cambia al alcanzar T/3, 2T/3 o 3T/3.
      // Si justo hay una alarma sonando/parpadeando, la reconocemos y paramos el sonido,
      // pero conservando el estado temporal real ya alcanzado.
      if (alarm[id]) {
        stopAlarmSound(id, getCurrentAlarmState(id));
      }
      previousElement.disabled = true;

      // Si todavía no hay P.OUT teórica o el campo está vacío, no forzamos error falso.
      if (isNaN(value) || isNaN(min) || isNaN(max)) {
        inputElement.classList.remove('blinking');
        return;
      }

      if (value < min || value > max) {
        inputElement.classList.add('blinking');
        if (value < min) {
          alert("El valor es menor que la Presion de Salida");
        } else if (value > max) {
          alert("El valor debe ser menor que la Presion anterior");
          inputElement.value = max;
        }
      } else {
        inputElement.classList.remove('blinking');
      }
      saveAppState();
    }

    document.addEventListener("visibilitychange", function() {

    function checkMissedAlarms() {
    const currentTime = Date.now();

    timer.forEach((isRunning, timerNumber) => {
        if (timerNumber === 0 || isRunning === 0) { return; }

        const elapsedTimeNow = Math.floor((currentTime - startTime[timerNumber]) / 1000);
        const previousElapsed = elapsedTime[timerNumber] || 0;

        // Si la pestaña estuvo en segundo plano, aplicamos solo la alarma más alta alcanzada.
        // Respetamos la lógica nueva: los campos de presión se muestran anticipados.
        if (elapsedTimeNow >= alarmTime && previousElapsed < alarmTime) {
            requestPressureInput(timerNumber, 3);
            playAlarmSound(timerNumber, 3);
        } else if (elapsedTimeNow >= Math.round(alarmTime * 2 / 3) && previousElapsed < Math.round(alarmTime * 2 / 3)) {
            requestPressureInput(timerNumber, 2);
            playAlarmSound(timerNumber, 2);
        } else if (elapsedTimeNow >= Math.round(alarmTime / 3) && previousElapsed < Math.round(alarmTime / 3)) {
            requestPressureInput(timerNumber, 1);
            playAlarmSound(timerNumber, 1);
        }
    });
  }

    
  function requestPressureInput(timerNumber, estado) {
  // Campos anticipados:
  // T0/inicio -> P1; alarma T1 -> P2; alarma T2 -> P3; alarma T3 -> P5 real.
  if (estado === 1) {
    mostrarInput(2, timerNumber);
    const f = document.getElementById(`oneQuartersTimeField${timerNumber}`);
    if (f && !f.innerHTML) {
      f.innerHTML = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      f.classList.add('reloj');
      f.style.display = "block";
    }
  } else if (estado === 2) {
    mostrarInput(3, timerNumber);
    const f = document.getElementById(`twoQuartersTimeField${timerNumber}`);
    if (f && !f.innerHTML) {
      f.innerHTML = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      f.classList.add('reloj');
      f.style.display = "block";
    }
  } else if (estado === 3) {
    mostrarInput(5, timerNumber);
    const f = document.getElementById(`totalTimeField${timerNumber}`);
    if (f && !f.innerHTML) {
      f.innerHTML = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      f.classList.add('reloj');
      f.style.display = "block";
    }
  }
}
